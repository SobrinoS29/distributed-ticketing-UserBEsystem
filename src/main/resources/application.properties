spring.application.name=esiusuarios
server.port=8081
server.ssl.key-store=keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat-8081

#BASE DE DATOS (ACCESO SI USAMOS SPRING)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=esiusuarios;encrypt=true;trustServerCertificate=true
spring.datasource.username=<username>
spring.datasource.password=<password>

# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update

server.error.include-message=always

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# URL del servicio de esiEntradas para envío de emails
esientradas.service.url=https://localhost:8080